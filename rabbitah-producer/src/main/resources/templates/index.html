<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rabbitah - Notification Sender</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #ff6600; }
        form { display: flex; gap: 10px; margin-top: 20px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 2px solid #ccc; border-radius: 6px; }
        button { padding: 10px 24px; font-size: 16px; background: #ff6600; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #e55b00; }
        .success { margin-top: 16px; padding: 12px; background: #d4edda; color: #155724; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Rabbitah - Producer</h1>
    <p>Send a notification message via RabbitMQ. The consumer app will print it to the console.</p>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form action="/send" method="post">
        <input type="text" name="message" placeholder="Type your message..." required>
        <button type="submit">Send</button>
    </form>
</body>
</html>
